name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx astro check

      - name: Unit tests
        run: npx vitest run

      # Runs the real nginx.conf under nginx:alpine. The E2E suite serves the site
      # with `astro preview` and so cannot catch a regression in the shipped
      # container's cache headers. Docker is preinstalled on ubuntu-latest.
      - name: Integration tests (nginx config)
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
