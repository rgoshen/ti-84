server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (Location: /ti-84/ not http://localhost/ti-84/).
    # The container listens on :80 internally but is published on another port
    # (e.g. :8084); an absolute redirect would bake in the wrong port and send the
    # browser to a dead URL when adding the trailing slash for directory routes.
    absolute_redirect off;

    # Astro fingerprints everything under /_astro/, so a changed file always arrives
    # under a changed filename. That makes the body at any given URL permanently
    # valid, which is exactly what `immutable` asserts: skip revalidation entirely,
    # even on an explicit reload. Scoped to this prefix rather than matched by file
    # extension because the guarantee comes from the hashed name, not the file type —
    # applying it to unhashed assets would pin them for a year.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Clean URLs for the Astro static build WITHOUT a trailing-slash redirect:
    # serve the directory's index.html directly (`$uri/index.html`) rather than
    # `$uri/`, which would issue a 301 to add the slash. Avoiding the 301 matters
    # because it would be a permanent redirect (cached by browsers) and, behind a
    # published port, nginx bakes the wrong port into it. So "/ti-84" serves
    # /ti-84/index.html with a 200.
    location / {
        try_files $uri $uri/index.html $uri.html =404;

        # Without an explicit directive, browsers fall back to heuristic freshness
        # (RFC 9111 §4.2.2) and reuse a cached page for ~10% of its age since
        # Last-Modified, sending no request at all. A stale page keeps referencing the
        # previous hashed bundle, so a freshly built one is never fetched and a
        # correct rebuild looks like it changed nothing.
        #
        # `no-cache` means "store it, but revalidate before reuse" — not "do not
        # store". The conditional request still 304s on an unchanged page, so this
        # costs a round trip rather than a re-download. `no-store` would forbid
        # caching outright and give up that 304.
        add_header Cache-Control "no-cache";
    }
}
